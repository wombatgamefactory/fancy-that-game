  <title>Fancy That! - Play Online | Wombat Game Factory</title>
  <meta name="description" content="Play Fancy That! online - a cozy tile-placement board game for 2-4 players. Sweep tiles, build colour patterns, and claim kawaii patisserie figurines.">

  <!-- LIGHT ONLY, DECLARED (plan section 8.10, stage 1). Dark mode is refused,
       not deferred: the ground is a pale linen cloth under one warm light and a
       dark version of it turns the lights off in the tearoom. Without this
       declaration Chrome on Android's automatic dark theme INVENTS one by
       inverting the page, which is the worst available outcome. The matching
       `color-scheme: light` sits on :root in style.css; both are needed - the
       meta is what the browser reads before the stylesheet arrives. -->
  <meta name="color-scheme" content="light">

  <!-- ===== Resource hints =================================================
       These sit ABOVE the three analytics tags on purpose. Everything below
       this block is either a third party or a piece of metadata, and the
       preload scanner reads the head in order.

       THE MODULE GRAPH IS WHAT BLOCKS FIRST PAINT, not the fonts (measured,
       plan section 12.3). index.html ships an empty <div id="app">, so nothing
       paints until the whole ES module graph has landed - and the graph was
       being discovered THREE round trips deep, because a module's imports are
       unknown until the module itself has been parsed:

           main.js               wave 1
           game.js, board.js     wave 2, not discovered until main.js parsed
           tiles.js, tastingMenus.js   wave 3, not discovered until game.js did

       Declaring all five up front flattens three waves into one, measured at
       -232ms of first paint at 4G and -520ms at Slow 4G for about 250 bytes of
       markup. It is the largest single lever in the build.

       FIVE LINES, NOT THE EIGHT THE PLAN NAMES. The plan's eight counted
       basicBot.js, mctsBot.js and statsCollector.js, which the SAME stage moves
       to a dynamic import() fired on window.load (main.js). Preloading them
       here would put all 57,499 gzipped bytes of them straight back on the
       landing page's critical path and cancel that change out. The five below
       are the whole of what the landing page's first paint waits for. -->
  <link rel="modulepreload" href="src/ui/main.js">
  <link rel="modulepreload" href="src/ui/board.js">
  <link rel="modulepreload" href="src/engine/game.js">
  <link rel="modulepreload" href="src/engine/tiles.js">
  <link rel="modulepreload" href="src/engine/tastingMenus.js">

  <!-- THE FONTS ARE SECOND IN THE QUEUE, which is why they moved here (plan
       section 12.3). On the shipped build the @import on style.css:1 cost
       nothing, because its chain finished at 663ms and first paint was not
       until 936ms. Preload the modules above and first paint moves to 680ms, at
       which point the @import chain IS the binding constraint and hoisting it
       into the HTML with preconnects is worth a further 192ms. The two changes
       are only worth making together. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz@9..144&family=Inter:wght@400;500;600;700&display=swap">

  <link rel="preload" as="image" href="images/landing/hero.jpg">
  <link rel="stylesheet" href="style.css" />

  <!-- THE GOAL-CARD SPRITE IS FETCHED AFTER THE LANDING PAGE, NOT BEFORE IT.
       The sheet is 521,384 bytes for a screen the player has not reached, and
       as a <link rel=preload> it held the connection from 114ms to 1,497ms at
       4G while the module graph first paint was waiting on shared the pipe with
       it. That alone was 42% of the landing page's critical-path payload and
       the one reason budget 2 failed.

       fetchpriority="low" ON THE PRELOAD WAS MEASURED AND DOES NOTHING - the
       request still starts at 111ms and finishes at the same moment. A priority
       hint is not a deferral. window.load is, and it is what the plan's
       deferral rule (section 12.4) asks for: the sheet still lands at 1,833ms
       instead of 1,497ms, warm long before anyone finishes choosing seats, and
       finding 19's card pop-in stays answered.

       The ?v= must match .card-market-sprite's in style.css EXACTLY or this
       warms a second copy of the sheet rather than the one the page draws. -->
  <script>
    addEventListener('load', () => {
      const sprite = new Image();
      sprite.fetchPriority = 'low';
      sprite.src = 'images/reward-cards-v9.webp?v=9';
    });
  </script>

  <!-- Open Graph -->
  <meta property="og:title" content="Fancy That! - Play Online">
  <meta property="og:description" content="A spot of strategy with your afternoon tea. Play the free online version of Fancy That!">
  <meta property="og:image" content="https://www.wombatgamefactory.com/images/fancy-that_logo_graph.jpg">
  <!-- THE CANONICAL HOST, not the github.io one. wombatgamefactory.github.io
       301s to www.wombatgamefactory.com, and measured on the open internet that
       redirect takes time to first byte from 251-256ms to 486-600ms - a quarter
       of the first-paint budget spent before the page starts, on the link a
       publisher is most likely to open. -->
  <meta property="og:url" content="https://www.wombatgamefactory.com/fancy-that-game/">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Fancy That! - Play Online">
  <meta name="twitter:description" content="A spot of strategy with your afternoon tea. Play the free online version of Fancy That!">
  <meta name="twitter:image" content="https://www.wombatgamefactory.com/images/fancy-that_logo_graph.jpg">

  <!-- Web app manifest. An INSTALLED game drops the browser chrome, which is
       worth roughly 110px of vertical space on a phone - the single largest
       piece of screen anything in this build can win back.

       theme_color is the deep ink #3D2B1F and background_color the wall #E4D7C0
       (defect 11, plan section 8.10). Both were the cream #FBF5EC, which put a
       pale system bar over a pale page with no edge between them and gave the
       splash screen a ground the finished game does not have.

       ORIENTATION IS NOW SET, to the portrait GROUP (manifest.json). Ticket 00
       left it out deliberately because locking it was the landscape ticket's
       decision to make; that ticket made it (plan section 9) and landscape is
       refused rather than deferred. -->
  <link rel="manifest" href="manifest.json">

  <!-- iOS ignores the manifest's display mode and reads these two instead.
       "black-translucent" would push the page under the status bar; "default"
       keeps the cream page starting below it, which is what the layout expects. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fancy That!">
  <meta name="theme-color" content="#3D2B1F">

  <!-- FAVICONS, LOCAL (stage 2, plan section 8.7). All four used to point at
       www.wombatgamefactory.com, so the game's own identity depended on a host
       it is not served from, and tools/layout-check.mjs route-blocked that host
       precisely so the round trip would not perturb a measurement. The teapot on
       the accent brown is built from AI Art/teapot_v2_master.png; at 32 and 16
       it is the cream silhouette, because a cream pot has no form left to read
       that small. The three remote files are not recoverable from this project
       and are not needed - nothing else referenced them. -->
  <link rel="icon" href="images/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="images/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/icons/apple-touch-icon-180.png">

  <!-- ===== THE ICON SPRITE (stage 2, plan section 8.7) ======================
       Thirteen icons on a 16 x 16 grid at 1.5 stroke, round cap, round join,
       fill none, one pixel of clear margin so the live area is 14 x 14, and
       every stroke centre on the quarter grid so an edge lands on a device
       pixel boundary at DPR 2 or 3. The stroke scales with the icon: 2.25 at
       24, 1.5 at 16, 1.13 at 12. Nothing here is drawn below 12px any more -
       the one glyph that went to 10 was `cupcake`, and it has left the set.

       THREE THINGS ABOUT THIS BLOCK ARE LOAD-BEARING.

       1. IT IS IN THE DOCUMENT, not an external file. <use href="icons.svg#x">
          is a second request and is blocked cross-origin in several browsers.
          The whole sprite is about 3.5 KB of markup, under 800 bytes gzipped,
          and zero requests - against 9.0 KB and two requests for the two arrow
          PNGs it replaces.
       2. IT IS OUTSIDE #app. board.js re-renders by assigning #app.innerHTML,
          so a sprite inside it would be destroyed by the first
          updateGameDisplay and every icon in the game would vanish. Same reason
          the toast element mounts on document.body.
       3. IT IS NOT AN ICON FONT. A webfont is a request on the critical path
          that renders as a box on failure and lands in the text layer where a
          screen reader can read it aloud as garbage - which is the emoji
          failure mode in a different wrapper.

       Colour comes from .ft-icon in style.css: --accent-deep #8E5239 by
       default, currentColor inside any control. Every <use> site carries
       aria-hidden="true" and the control carries the real label; no icon here
       is ever the accessible name of anything.

       Thirteen became FIFTEEN at stage 8: `sound` and `sound-off` are the mute's
       two states (plan section 13.7). Every one of them is wired - cake-stand,
       grid and card were drawn here by stage 2 and taken up by stage 7's rail
       chips, which is what stopped that stage inventing a second family.

       FIFTEEN BECAME FOURTEEN ON 10 AUGUST: `cupcake` is gone from the set. It
       was the only member that stood for an OBJECT rather than for an action or
       a category, the game already had painted art for that object in the supply
       header, and drawing the same thing two ways is what a player actually
       notices. All six of its sites now use cupcakeMark() in board.js, which
       serves images/cupcake-v2.png. The line set is for interface; the currency
       is a component, and it is drawn as one. Do NOT re-add a cupcake glyph
       here - if a monochrome cupcake is ever wanted again, the question to
       answer first is why the painted one is not right in that place. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
    <symbol id="i-close" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.5 4.5 11.5 11.5M11.5 4.5 4.5 11.5"/>
    </symbol>
    <symbol id="i-undo" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5.75 4.25 2.75 7.25l3 3"/>
      <path d="M2.75 7.25h6.5a3.5 3.5 0 1 1 0 7H6.5"/>
    </symbol>
    <symbol id="i-arrow-right" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.75 8h10.5"/><path d="M9 4.25 12.75 8 9 11.75"/>
    </symbol>
    <symbol id="i-arrow-left" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13.25 8H2.75"/><path d="M7 4.25 3.25 8 7 11.75"/>
    </symbol>
    <symbol id="i-arrow-down" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 2.75v10.5"/><path d="M4.25 9 8 12.75 11.75 9"/>
    </symbol>
    <symbol id="i-book" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 4.5v9"/>
      <path d="M8 4.5C6.6 3.3 4.6 3 2.5 3.4v8.4c2.1-.4 4.1-.1 5.5 1.2 1.4-1.3 3.4-1.6 5.5-1.2V3.4c-2.1-.4-4.1-.1-5.5 1.1z"/>
    </symbol>
    <symbol id="i-person" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="5.5" r="2.5"/><path d="M3.5 13.75a4.5 4.5 0 0 1 9 0"/>
    </symbol>
    <symbol id="i-bot" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.75" y="6.5" width="10.5" height="7" rx="1.75"/>
      <path d="M8 3.75v2.75"/><path d="M8 2.5h.01"/>
      <path d="M6 10h.01"/><path d="M10 10h.01"/>
    </symbol>
    <symbol id="i-crumb-tray" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 9.25h12l-1.7 4.25h-8.6z"/>
      <path d="M5.5 6.6h.01"/><path d="M10.5 6.6h.01"/>
    </symbol>
    <symbol id="i-cake-stand" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5.25 5.6c.5 1.4 4.5 1.4 5 0"/>
      <path d="M8 6.6v3.1"/>
      <path d="M2.9 9.7c.7 1.7 9.5 1.7 10.2 0"/>

      <path d="M5.9 13.5h4.2"/>
    </symbol>
    <symbol id="i-grid" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.75" y="2.75" width="4.5" height="4.5" rx="1"/>
      <rect x="8.75" y="2.75" width="4.5" height="4.5" rx="1"/>
      <rect x="2.75" y="8.75" width="4.5" height="4.5" rx="1"/>
      <rect x="8.75" y="8.75" width="4.5" height="4.5" rx="1"/>
    </symbol>
    <symbol id="i-card" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.25" y="2.5" width="9.5" height="11" rx="1.5"/>
      <path d="M6.25 6h.01"/><path d="M9.75 6h.01"/>
      <path d="M6.25 9.75h.01"/><path d="M9.75 9.75h.01"/>
    </symbol>
    <!-- THE MUTE'S TWO STATES (stage 8, plan section 13.7 amendment 1). Thirteen
         icons become fifteen, on section 8.7's own rules - 16 grid, 1.5 stroke,
         one sprite - and THE STATE IS CARRIED BY SHAPE rather than by colour: two
         arcs against a cross, on the same cone. -->
    <symbol id="i-sound" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.75 2.75 4.5 5.75H2.25v4.5H4.5l3.25 3z"/>
      <path d="M10.6 6a3.2 3.2 0 0 1 0 4"/>
      <path d="M12.6 4a6 6 0 0 1 0 8"/>
    </symbol>
    <symbol id="i-sound-off" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.75 2.75 4.5 5.75H2.25v4.5H4.5l3.25 3z"/>
      <path d="M10.75 6.25 13.75 9.25"/><path d="M13.75 6.25 10.75 9.25"/>
    </symbol>
  </defs></svg>

  <div id="app"></div>
  <script type="module" src="src/ui/main.js"></script>
